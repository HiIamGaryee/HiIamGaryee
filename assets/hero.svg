<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Garyee — Full-Stack Software Engineer</title>
  <desc id="description">Minimal premium dark banner with muted gold typography, geometric shapes, and a cinematic atmosphere.</desc>
  <defs>
